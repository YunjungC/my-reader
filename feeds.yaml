# ─────────────────────────────────────────────
#  내 리더 설정 파일
#  - top_n: 피드마다 최신 몇 건만 보여줄지
#  - summary_chars: 미리보기 요약 글자 수
#  - 피드 추가: 아래 feeds 목록에 name / url 두 줄만 추가하면 됩니다
#  - Feeder에서 OPML을 내보내 이 폴더에 feeds.opml 로 올리면
#    거기 있는 피드도 자동으로 함께 읽습니다 (같은 주소는 한 번만)
# ─────────────────────────────────────────────

top_n: 10
summary_chars: 220

feeds:
  # AI Matters: 사이트의 RSS가 봇 차단 때문에 막혀 있어서,
  # 구글 뉴스가 수집한 AI Matters 기사로 대신 받습니다.
  # 구글 알리미에서 "site:aimatters.co.kr" 알림을 RSS로 만들었다면
  # 그 주소로 바꿔 넣으면 더 빠르고 정확합니다.
  - name: AI Matters 최신 뉴스
    url: https://news.google.com/rss/search?q=site:aimatters.co.kr&hl=ko&gl=KR&ceid=KR:ko
    site: https://aimatters.co.kr

  # 구글 알리미 (알리미 설정 → 전송 위치 "RSS 피드" → RSS 아이콘 주소)
  - name: Google 알리미 - 과기정통부 AI 정책
    url: https://www.google.co.kr/alerts/feeds/11999480042175370274/115563606942436386
    site: https://www.google.com/alerts

  - name: Axios
    url: https://api.axios.com/feed/top/
    site: https://www.axios.com

  - name: GeekNews
    url: https://news.hada.io/rss/news
    site: https://news.hada.io

  - name: Simon Willison's Weblog
    url: https://simonwillison.net/atom/everything/
    site: https://simonwillison.net

  - name: AI타임스 - 전체기사
    url: https://www.aitimes.com/rss/allArticle.xml
    site: https://www.aitimes.com

  # KDI 경제정보센터 3개 피드는 Feeder에서 쓰던 주소를 그대로 쓰는 게 가장 정확합니다.
  # feeds.opml 을 올리면 자동으로 들어오고, 직접 넣으려면 아래처럼:
  # - name: KDI경제정보센터 국내 연구 자료
  #   url: (Feeder의 피드 설정에서 복사한 주소)

  - name: MIT Technology Review
    url: https://www.technologyreview.com/feed/
    site: https://www.technologyreview.com

  - name: Microsoft Research
    url: https://www.microsoft.com/en-us/research/feed/
    site: https://www.microsoft.com/en-us/research

  - name: Stratechery
    url: https://stratechery.com/feed/
    site: https://stratechery.com

  - name: DCD
    url: https://www.datacenterdynamics.com/en/rss/
    site: https://www.datacenterdynamics.com

  - name: Presidential Actions – The White House
    url: https://www.whitehouse.gov/presidential-actions/feed/
    site: https://www.whitehouse.gov

  - name: The Register - Software
    url: https://www.theregister.com/software/headlines.atom
    site: https://www.theregister.com
